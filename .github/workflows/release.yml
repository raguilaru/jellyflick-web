name: Release container

# A separate workflow from ci.yml on purpose. This one has a different trigger
# (push to main only), needs `packages: write`, and takes far longer because the
# arm64 image is built under emulation. Mixing the two would slow every pull
# request for no benefit.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One build at a time, and a newer push to main makes an in-flight one
# pointless, so cancel it.
concurrency:
  group: release-container
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: read the repository, write packages, nothing else.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # QEMU is what lets one amd64 runner produce the arm64 image, for the
      # host's Raspberry Pi.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN is enough to push here because the Dockerfile carries
      # org.opencontainers.image.source, which links the package to this
      # repository. Without that label the push can be refused.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what the compose file and OMV's scheduled pull follow.
          # The long sha tag gives the host something to pin or roll back to.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # The arm64 stage runs `npm ci` and the Vite build under emulation, so
          # a cold build is slow. Persisting the layer cache turns most pushes
          # into layer reuse.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The package inherits the repository's visibility, so it stays private.
      # The host pulls it with a classic PAT scoped to read:packages; see
      # docs/setup.md.
      - name: Summary
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo 'Private image. The host signs in once: docs/setup.md.'
          } >>"$GITHUB_STEP_SUMMARY"
